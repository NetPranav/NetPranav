name: Update Profile

on:
  schedule:
    - cron: '17 0 * * *' # daily, a little after midnight UTC (GitHub delays jobs queued on the hour)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the daily schedule rules
        run: npm test

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render today's profile
        run: node scripts/daily/render.js
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Commit and push
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md generated/
          git diff --staged --quiet || (git commit -m "Daily profile update [skip ci]" && git pull --rebase && git push)
