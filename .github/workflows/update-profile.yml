name: Update Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate Dashboard SVG
        run: node scripts/generate_dashboard.js
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Generate Projects SVG
        run: node scripts/generate_projects.js
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Commit & Push Generated SVGs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add generated/
          git commit -m "Auto-update profile SVGs" || echo "No changes to commit"
          git push
