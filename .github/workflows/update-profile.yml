name: Update Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Dashboard SVG
        run: node scripts/generate_dashboard.js
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Generate Projects SVG
        run: node scripts/generate_projects.js
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Commit & Push Generated SVGs
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add generated/
          git diff --staged --quiet || (git commit -m "Auto-update profile SVGs" && git push)

