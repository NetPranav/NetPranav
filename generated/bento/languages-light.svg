<style>@font-face{font-family:BentoMono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:BentoSans;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:BentoSans;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
