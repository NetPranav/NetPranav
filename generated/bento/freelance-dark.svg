<style>@font-face{font-family:BentoMono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:BentoSans;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:BentoSans;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:BentoSans;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@keyframes ping{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.6);opacity:0}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.nudge>path{animation:nudge 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

