<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
      .bg { fill: transparent; stroke: rgba(255,255,255,0.15); stroke-width: 1; rx: 8px; }
      .text { font-family: 'Inter', -apple-system, sans-serif; fill: #ededed; }
      .label { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; fill: #888888; text-transform: uppercase; letter-spacing: 1px; }
      .value { font-family: 'Inter', sans-serif; font-size: 36px; font-weight: 600; fill: #ffffff; }
      .divider { stroke: rgba(255,255,255,0.15); stroke-width: 1; }
      .status-dot { fill: #ffffff; }
      .subtext { font-family: 'Inter', sans-serif; font-size: 13px; fill: #888888; }
      .highlight { fill: #ffffff; font-weight: 600; }
      .bar-bg { fill: #333333; }
      .bar-fill { fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="848" height="168" x="1" y="1" />
  
  <g transform="translate(40, 45)">
    
    <!-- Left Column: Primary Stats -->
    <g transform="translate(0, 0)">
      <text class="label" y="0">Repositories</text>
      <text class="value" y="45">49</text>
    </g>
    
    <g transform="translate(200, 0)">
      <text class="label" y="0">Followers</text>
      <text class="value" y="45">6</text>
    </g>

    <!-- Vertical Divider -->
    <line class="divider" x1="425" y1="-10" x2="425" y2="80" />

    <!-- Right Column: Language Chart -->
    <g transform="translate(470, 0)">
      <text class="label" y="0">Top Languages</text>
      <g transform="translate(0, 15)">
        
      <text class="subtext" x="0" y="12">TypeScript</text>
      <text class="subtext highlight" x="110" y="12">52%</text>
      <rect class="bar-bg" x="0" y="18" width="200" height="4" rx="2" />
      <rect class="bar-fill" x="0" y="18" width="104" height="4" rx="2" />
    
      <text class="subtext" x="0" y="47">Python</text>
      <text class="subtext highlight" x="110" y="47">26%</text>
      <rect class="bar-bg" x="0" y="53" width="200" height="4" rx="2" />
      <rect class="bar-fill" x="0" y="53" width="52" height="4" rx="2" />
    
      <text class="subtext" x="0" y="82">JavaScript</text>
      <text class="subtext highlight" x="110" y="82">5%</text>
      <rect class="bar-bg" x="0" y="88" width="200" height="4" rx="2" />
      <rect class="bar-fill" x="0" y="88" width="10" height="4" rx="2" />
    
      </g>
    </g>
  </g>
</svg>