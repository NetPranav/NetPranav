<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <!-- Accretion Disk Gradient -->
    <radialGradient id="accretion" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#000000"/>
      <stop offset="60%" stop-color="#ff6600"/>
      <stop offset="80%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&amp;display=swap');
      
      .bg { fill: #000000; }
      .event-horizon { fill: #000000; }
      
      .suck-item {
        font-family: 'Fira Code', monospace;
        font-size: 24px;
        fill: #ff6600;
        transform-origin: 400px 150px;
        text-anchor: middle;
      }
      
      .suck-blue { fill: #00e5ff; }
      .suck-white { fill: #ffffff; }
      
      @keyframes suck1 {
        0% { transform: rotate(0deg) translateX(250px) scale(1); opacity: 0; }
        10% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: rotate(360deg) translateX(0px) scale(0); opacity: 0; }
      }
      @keyframes suck2 {
        0% { transform: rotate(120deg) translateX(280px) scale(1.5); opacity: 0; }
        10% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: rotate(480deg) translateX(0px) scale(0); opacity: 0; }
      }
      @keyframes suck3 {
        0% { transform: rotate(240deg) translateX(220px) scale(0.8); opacity: 0; }
        10% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: rotate(600deg) translateX(0px) scale(0); opacity: 0; }
      }
      
      .item1 { animation: suck1 3.5s cubic-bezier(0.5, 0, 1, 1) infinite; }
      .item2 { animation: suck2 4.2s cubic-bezier(0.5, 0, 1, 1) infinite 1s; }
      .item3 { animation: suck3 3.8s cubic-bezier(0.5, 0, 1, 1) infinite 0.5s; }
      .item4 { animation: suck1 4.5s cubic-bezier(0.5, 0, 1, 1) infinite 2s; }
      .item5 { animation: suck2 3.2s cubic-bezier(0.5, 0, 1, 1) infinite 1.5s; }
      .item6 { animation: suck3 4.8s cubic-bezier(0.5, 0, 1, 1) infinite 2.5s; }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .disk-group {
        transform-origin: 400px 150px;
        transform: scaleY(0.25);
      }
      
      .disk {
        transform-origin: 400px 150px;
        animation: spin 8s linear infinite;
      }
      
      .title {
        font-family: 'Inter', sans-serif;
        font-size: 28px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 6px;
        text-transform: uppercase;
      }
      
      .subtitle {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        fill: #888888;
        letter-spacing: 2px;
      }
    </style>
  </defs>
  
  <rect class="bg" width="800" height="300" />
  
  <!-- Text -->
  <text x="50%" y="40" text-anchor="middle" class="title">Consuming Complexity</text>
  <text x="50%" y="65" text-anchor="middle" class="subtitle">ENGINEERING THROUGH THE EVENT HORIZON</text>
  
  <g class="disk-group">
    <!-- Back of disk -->
    <circle cx="400" cy="150" r="280" fill="url(#accretion)" class="disk"/>
  </g>
  
  <!-- Sucking Items -->
  <text class="suck-item item1" x="400" y="150">&lt;/&gt;</text>
  <text class="suck-item item2 suck-blue" x="400" y="150">{ }</text>
  <text class="suck-item item3 suck-white" x="400" y="150">#</text>
  <text class="suck-item item4 suck-blue" x="400" y="150">Bug</text>
  <text class="suck-item item5 suck-white" x="400" y="150">O(n²)</text>
  <text class="suck-item item6 suck-blue" x="400" y="150">Debt</text>

  <!-- Front Glow -->
  <circle cx="400" cy="150" r="70" fill="url(#glow)" />
  
  <!-- Event Horizon (Pure Black) -->
  <circle cx="400" cy="150" r="45" class="event-horizon" />
</svg>
