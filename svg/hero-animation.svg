<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <!-- Maximum Effort 3D Chrome Lighting Filter -->
    <filter id="chrome" x="-20%" y="-20%" width="140%" height="140%">
      <!-- 1. Create a bump map from the text's alpha channel -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
      
      <!-- 2. Apply specular lighting to simulate a shiny 3D metallic surface -->
      <!-- The light source sweeps across the text continuously -->
      <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.5" specularExponent="30" lighting-color="#ffffff" result="specOut">
        <fePointLight y="100" z="150">
          <!-- SINGLE CONTINUOUS ANIMATION: The light sweeping left and right -->
          <animate attributeName="x" values="-200; 1000; -200" dur="4s" repeatCount="indefinite" />
        </fePointLight>
      </feSpecularLighting>
      
      <!-- 3. Mask the light to only appear on the text -->
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOutMasked" />
      
      <!-- 4. Add the light reflection to the base text color -->
      <feComposite in="SourceGraphic" in2="specOutMasked" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litText" />
      
      <!-- 5. Add a subtle drop shadow to ground it -->
      <feDropShadow in="litText" dx="0" dy="15" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.1" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&amp;display=swap');
      
      .bg { fill: transparent; }
      
      .text {
        font-family: 'Syncopate', sans-serif;
        font-size: 68px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 12px;
        text-anchor: middle;
        /* Dark base so the sweeping light reflection pops dramatically */
        fill: #222222; 
        filter: url(#chrome);
      }
    </style>
  </defs>

  <rect class="bg" width="800" height="200" />
  
  <!-- The single animated element -->
  <text x="51%" y="58%" class="text">PRANAV DUBEY</text>
</svg>
