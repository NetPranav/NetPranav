<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 135" width="100%" height="135">
  <defs>
    <!-- Organic Aurora Glow -->
    <filter id="aurora-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation" values="2; 5; 2" dur="5s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Seamless Aurora Sweep Gradient -->
    <linearGradient id="aurora-sweep" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="20%" stop-color="#10B981" />
      <stop offset="40%" stop-color="#64FFDA" />
      <stop offset="55%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#00D9F5" />
      <stop offset="85%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
      <animate attributeName="x1" values="0%; -100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%; 100%" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Space+Grotesk:wght@600;700&amp;family=Fira+Code:wght@500&amp;display=swap');
      
      .bg { fill: transparent; }
      
      .hero-title {
        font-family: 'Space Grotesk', 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 56px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 8px;
        text-anchor: middle;
        fill: url(#aurora-sweep);
      }
      
      .hero-outline {
        font-family: 'Space Grotesk', 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 56px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 8px;
        text-anchor: middle;
        fill: none;
        stroke: #64FFDA;
        stroke-width: 1px;
        opacity: 0.6;
        filter: url(#aurora-glow);
        stroke-dasharray: 18 18;
        animation: flow 4s linear infinite;
      }
      
      .hero-badge {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 3px;
        text-transform: uppercase;
        text-anchor: middle;
        fill: #94A3B8;
      }
      
      .highlight-badge {
        fill: #00F5A0;
        font-weight: 600;
      }

      @keyframes flow {
        from { stroke-dashoffset: 36; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect class="bg" width="850" height="135" />
  
  <!-- Aurora Title -->
  <text x="50%" y="62" class="hero-title">PRANAV DUBEY</text>
  <text x="50%" y="62" class="hero-outline">PRANAV DUBEY</text>
  
  <!-- Subtitle Tagline -->
  <g transform="translate(0, 102)">
    <text x="50%" y="0" class="hero-badge">
      <tspan class="highlight-badge">SYSTEMS ARCHITECT</tspan>
      <tspan fill="#10B981"> • </tspan>
      <tspan>DISTRIBUTED COMPUTATION</tspan>
      <tspan fill="#10B981"> • </tspan>
      <tspan class="highlight-badge">REAL-WORLD AI</tspan>
    </text>
  </g>
</svg>
