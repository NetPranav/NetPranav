<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&amp;display=swap');
      
      .bg { fill: transparent; }
      
      .text-base {
        font-family: 'Syncopate', sans-serif;
        font-size: 64px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 12px;
        text-anchor: middle;
        fill: #ffffff;
        opacity: 0;
        /* Runs exactly ONCE and holds the final solid state */
        animation: fadeIn 2.5s ease-out forwards 2.5s;
      }
      
      .text-stroke {
        font-family: 'Syncopate', sans-serif;
        font-size: 64px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 12px;
        text-anchor: middle;
        fill: none;
        stroke: #ffffff;
        stroke-width: 1.5px;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        /* Runs exactly ONCE to draw the outline */
        animation: draw 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }
      
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
      
      @keyframes fadeIn {
        from { filter: blur(5px); transform: scale(0.98); }
        to { opacity: 1; filter: blur(0px); transform: scale(1); }
      }
    </style>
  </defs>

  <rect class="bg" width="800" height="120" />
  
  <!-- Solid Fill Text -->
  <text x="51%" y="75%" class="text-base">PRANAV DUBEY</text>
  
  <!-- Animated Stroke Trace -->
  <text x="51%" y="75%" class="text-stroke">PRANAV DUBEY</text>
</svg>
