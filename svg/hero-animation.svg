<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <defs>
    <!-- Continuous Liquid Energy Filter -->
    <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.05" numOctaves="2" result="noise">
        <animate attributeName="baseFrequency" values="0.015 0.05; 0.03 0.1; 0.015 0.05" dur="4s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" values="5; 20; 5" dur="4s" repeatCount="indefinite" />
      </feDisplacementMap>
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&amp;display=swap');
      
      .bg { fill: transparent; }
      
      .text-base {
        font-family: 'Syncopate', sans-serif;
        font-size: 64px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 12px;
        text-anchor: middle;
        fill: #ffffff;
      }
      
      .text-liquid {
        font-family: 'Syncopate', sans-serif;
        font-size: 64px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 12px;
        text-anchor: middle;
        fill: #ffffff;
        filter: url(#liquid);
        opacity: 0.6;
      }
      
      .text-stroke {
        font-family: 'Syncopate', sans-serif;
        font-size: 64px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 12px;
        text-anchor: middle;
        fill: none;
        stroke: #ffffff;
        stroke-width: 2px;
        opacity: 0.8;
      }
    </style>
  </defs>

  <rect class="bg" width="800" height="120" />
  
  <!-- The Liquid Energy Aura -->
  <text x="51%" y="75%" class="text-liquid">PRANAV DUBEY</text>
  
  <!-- The Solid Core Text -->
  <text x="51%" y="75%" class="text-base">PRANAV DUBEY</text>
  
  <!-- Sharp Outline -->
  <text x="51%" y="75%" class="text-stroke">PRANAV DUBEY</text>
</svg>
