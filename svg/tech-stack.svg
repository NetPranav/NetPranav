<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
      
      .category-title {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #E01A22;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      
      .card {
        fill: #0d0d0d;
        stroke: #222222;
        stroke-width: 1;
        rx: 6px;
      }
      
      .text {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #dddddd;
      }
    </style>
  </defs>

  <!-- Languages -->
  <g transform="translate(10, 20)">
    <text x="0" y="0" class="category-title">Languages</text>
    
    <g transform="translate(0, 15)">
      <rect class="card" width="110" height="36" />
      <circle cx="20" cy="18" r="6" fill="#3178C6" />
      <text x="35" y="22" class="text">TypeScript</text>
    </g>
    <g transform="translate(120, 15)">
      <rect class="card" width="90" height="36" />
      <circle cx="20" cy="18" r="6" fill="#3572A5" />
      <text x="35" y="22" class="text">Python</text>
    </g>
    <g transform="translate(220, 15)">
      <rect class="card" width="90" height="36" />
      <circle cx="20" cy="18" r="6" fill="#f34b7d" />
      <text x="35" y="22" class="text">C++</text>
    </g>
    <g transform="translate(320, 15)">
      <rect class="card" width="100" height="36" />
      <circle cx="20" cy="18" r="6" fill="#00ADD8" />
      <text x="35" y="22" class="text">Go</text>
    </g>
  </g>

  <!-- Frontend -->
  <g transform="translate(10, 100)">
    <text x="0" y="0" class="category-title">Frontend</text>
    
    <g transform="translate(0, 15)">
      <rect class="card" width="90" height="36" />
      <circle cx="20" cy="18" r="6" fill="#61DAFB" />
      <text x="35" y="22" class="text">React</text>
    </g>
    <g transform="translate(100, 15)">
      <rect class="card" width="100" height="36" />
      <circle cx="20" cy="18" r="6" fill="#ffffff" stroke="#30363d" stroke-width="1" />
      <text x="35" y="22" class="text">Next.js</text>
    </g>
    <g transform="translate(210, 15)">
      <rect class="card" width="105" height="36" />
      <circle cx="20" cy="18" r="6" fill="#06B6D4" />
      <text x="35" y="22" class="text">Tailwind</text>
    </g>
  </g>

  <!-- Backend & DB -->
  <g transform="translate(350, 100)">
    <text x="0" y="0" class="category-title">Backend &amp; Databases</text>
    
    <g transform="translate(0, 15)">
      <rect class="card" width="100" height="36" />
      <circle cx="20" cy="18" r="6" fill="#339933" />
      <text x="35" y="22" class="text">Node.js</text>
    </g>
    <g transform="translate(110, 15)">
      <rect class="card" width="115" height="36" />
      <circle cx="20" cy="18" r="6" fill="#336791" />
      <text x="35" y="22" class="text">PostgreSQL</text>
    </g>
    <g transform="translate(235, 15)">
      <rect class="card" width="95" height="36" />
      <circle cx="20" cy="18" r="6" fill="#47A248" />
      <text x="35" y="22" class="text">MongoDB</text>
    </g>
  </g>

  <!-- Tools & Infrastructure -->
  <g transform="translate(10, 180)">
    <text x="0" y="0" class="category-title">Tools &amp; Infrastructure</text>
    
    <g transform="translate(0, 15)">
      <rect class="card" width="95" height="36" />
      <circle cx="20" cy="18" r="6" fill="#2496ED" />
      <text x="35" y="22" class="text">Docker</text>
    </g>
    <g transform="translate(105, 15)">
      <rect class="card" width="85" height="36" />
      <circle cx="20" cy="18" r="6" fill="#FF9900" />
      <text x="35" y="22" class="text">AWS</text>
    </g>
    <g transform="translate(200, 15)">
      <rect class="card" width="95" height="36" />
      <circle cx="20" cy="18" r="6" fill="#F05032" />
      <text x="35" y="22" class="text">Git</text>
    </g>
    <g transform="translate(305, 15)">
      <rect class="card" width="105" height="36" />
      <circle cx="20" cy="18" r="6" fill="#000000" stroke="#30363d" stroke-width="1" />
      <text x="35" y="22" class="text">Vercel</text>
    </g>
  </g>
  
  <!-- AI / ML -->
  <g transform="translate(440, 180)">
    <text x="0" y="0" class="category-title">AI / Machine Learning</text>
    
    <g transform="translate(0, 15)">
      <rect class="card" width="105" height="36" />
      <circle cx="20" cy="18" r="6" fill="#EE4C2C" />
      <text x="35" y="22" class="text">PyTorch</text>
    </g>
    <g transform="translate(115, 15)">
      <rect class="card" width="125" height="36" />
      <circle cx="20" cy="18" r="6" fill="#FF6F00" />
      <text x="35" y="22" class="text">TensorFlow</text>
    </g>
  </g>

</svg>
