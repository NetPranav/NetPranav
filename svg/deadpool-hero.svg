<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;display=swap');
      
      .bg { fill: #0d0d0d; }
      
      .text-base {
        font-family: 'Anton', sans-serif;
        font-size: 72px;
        letter-spacing: 6px;
        opacity: 0;
      }
      
      .text {
        fill: #E01A22; /* Deadpool Red */
        animation: reveal 0.3s ease forwards 0.8s;
      }
      
      .text-shadow {
        fill: transparent;
        stroke: #ffffff;
        stroke-width: 1px;
        animation: reveal 0.3s ease forwards 0.9s;
        transform: translate(3px, 3px);
      }
      
      .slash1 {
        transform-origin: 400px 100px;
        opacity: 0;
        animation: slashAnim 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards 0.4s;
      }
      
      .slash2 {
        transform-origin: 400px 100px;
        opacity: 0;
        animation: slashAnim2 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards 0.6s;
      }
      
      @keyframes reveal {
        0% { opacity: 0; transform: scale(0.9) translateY(10px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      
      @keyframes slashAnim {
        0% { transform: rotate(15deg) scaleX(0) translateX(-400px); opacity: 1; }
        50% { transform: rotate(15deg) scaleX(1.5) translateX(0px); opacity: 1; }
        100% { transform: rotate(15deg) scaleX(0) translateX(400px); opacity: 0; }
      }
      
      @keyframes slashAnim2 {
        0% { transform: rotate(-25deg) scaleX(0) translateX(400px); opacity: 1; }
        50% { transform: rotate(-25deg) scaleX(1.5) translateX(0px); opacity: 1; }
        100% { transform: rotate(-25deg) scaleX(0) translateX(-400px); opacity: 0; }
      }
      
      .halftone {
        fill: url(#dots);
        opacity: 0.1;
      }
    </style>
    
    <pattern id="dots" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#E01A22" />
    </pattern>
  </defs>
  
  <rect class="bg" width="800" height="200" />
  <rect class="halftone" width="800" height="200" />
  
  <text x="50%" y="60%" text-anchor="middle" class="text-base text-shadow">MAXIMUM EFFORT.</text>
  <text x="50%" y="60%" text-anchor="middle" class="text-base text">MAXIMUM EFFORT.</text>
  
  <!-- Slashes -->
  <g class="slash1">
    <rect x="0" y="98" width="800" height="4" fill="#ffffff" />
    <rect x="0" y="96" width="800" height="8" fill="#E01A22" opacity="0.5" />
  </g>
  
  <g class="slash2">
    <rect x="0" y="98" width="800" height="5" fill="#E01A22" />
    <rect x="0" y="96" width="800" height="9" fill="#ffffff" opacity="0.5" />
  </g>
</svg>
