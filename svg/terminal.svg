<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="360">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap');
      
      .window {
        fill: #060B08;
        stroke: rgba(16, 185, 129, 0.25);
        stroke-width: 1;
        rx: 10px;
      }
      .header {
        fill: #0B140F;
        stroke: rgba(16, 185, 129, 0.2);
        stroke-width: 1;
      }
      .dot-1 { fill: #EF4444; opacity: 0.85; }
      .dot-2 { fill: #F59E0B; opacity: 0.85; }
      .dot-3 { fill: #10B981; opacity: 0.85; }
      
      .text {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        fill: #94A3B8;
      }
      
      .prompt-user { fill: #10B981; font-weight: 600; }
      .prompt-symbol { fill: #00F5A0; font-weight: 600; }
      .dir { fill: #64FFDA; font-weight: 500; }
      .command { fill: #FFFFFF; font-weight: 500; }
      .output { fill: #CBD5E1; }
      .tag { fill: #00F5A0; font-weight: 600; text-shadow: 0 0 6px rgba(0, 245, 160, 0.4); }
      .dim { fill: #64748B; }
      
      .line { opacity: 0; }
      
      @keyframes type {
        0% { opacity: 0; }
        1% { opacity: 1; }
        100% { opacity: 1; }
      }
      
      .l1 { animation: type 8s steps(1, end) 0s forwards; }
      .l2 { animation: type 8s steps(1, end) 0.4s forwards; }
      
      .l3 { animation: type 8s steps(1, end) 1.2s forwards; }
      .l4 { animation: type 8s steps(1, end) 1.6s forwards; }
      .l5 { animation: type 8s steps(1, end) 1.8s forwards; }
      .l6 { animation: type 8s steps(1, end) 2.0s forwards; }
      
      .l7 { animation: type 8s steps(1, end) 2.8s forwards; }
      .l8 { animation: type 8s steps(1, end) 3.2s forwards; }
      
      .l9 { animation: type 8s steps(1, end) 4.0s forwards; }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        fill: #00F5A0;
        animation: blink 1s step-end infinite;
      }
    ]]></style>
  </defs>

  <!-- Terminal Window Background -->
  <rect class="window" x="10" y="10" width="830" height="340" rx="10" />
  
  <!-- Window Header Bar -->
  <path class="header" d="M 10 20 Q 10 10 20 10 L 830 10 Q 840 10 840 20 L 840 38 L 10 38 Z" />
  <line x1="10" y1="38" x2="840" y2="38" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle class="dot-1" cx="30" cy="24" r="5" />
  <circle class="dot-2" cx="46" cy="24" r="5" />
  <circle class="dot-3" cx="62" cy="24" r="5" />
  
  <text x="425" y="27" font-family="'Fira Code', monospace" font-size="11.5" fill="#64748B" text-anchor="middle">pranav@terra-node: ~/workspace</text>
  
  <!-- Terminal Content Stream -->
  <g class="text" transform="translate(30, 68)">
    
    <!-- Block 1: Identity -->
    <g class="line l1">
      <text x="0" y="0"><tspan class="prompt-user">pranav@terra</tspan><tspan class="dim">:</tspan><tspan class="dir">~</tspan> <tspan class="prompt-symbol">❯</tspan> <tspan class="command">whoami</tspan></text>
    </g>
    <g class="line l2">
      <text x="0" y="22" class="output">Pranav Dubey <tspan class="dim">—</tspan> <tspan class="tag">Systems Architect &amp; AI Engineer</tspan></text>
    </g>
    
    <!-- Block 2: Focus Initiatives -->
    <g class="line l3">
      <text x="0" y="56"><tspan class="prompt-user">pranav@terra</tspan><tspan class="dim">:</tspan><tspan class="dir">~/ecosystem</tspan> <tspan class="prompt-symbol">❯</tspan> <tspan class="command">cat focus.md</tspan></text>
    </g>
    <g class="line l4"><text x="0" y="78" class="output">◆ <tspan class="tag">Smart Farming AI:</tspan> Edge Computer Vision &amp; crop telemetry.</text></g>
    <g class="line l5"><text x="0" y="100" class="output">◆ <tspan class="tag">Distributed Core:</tspan> Fault-tolerant, high-throughput routing engine.</text></g>
    <g class="line l6"><text x="0" y="122" class="output">◆ <tspan class="tag">MockMate:</tspan> Real-time multimodal AI interview simulator.</text></g>

    <!-- Block 3: Directive -->
    <g class="line l7">
      <text x="0" y="156"><tspan class="prompt-user">pranav@terra</tspan><tspan class="dim">:</tspan><tspan class="dir">~</tspan> <tspan class="prompt-symbol">❯</tspan> <tspan class="command">echo $DIRECTIVE</tspan></text>
    </g>
    <g class="line l8">
      <text x="0" y="178" class="output">Architecting resilient, high-throughput systems with biological elegance.</text>
    </g>

    <!-- Block 4: Active Prompt -->
    <g class="line l9">
      <text x="0" y="212"><tspan class="prompt-user">pranav@terra</tspan><tspan class="dim">:</tspan><tspan class="dir">~</tspan> <tspan class="prompt-symbol">❯</tspan> <tspan class="command cursor">█</tspan></text>
    </g>
  </g>
</svg>
