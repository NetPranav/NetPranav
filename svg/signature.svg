<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;display=swap');
      
      @keyframes drawLine {
        from { stroke-dashoffset: 800; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes fillText {
        0% { fill: transparent; stroke: #8b949e; stroke-width: 1px; }
        100% { fill: #f0f6fc; stroke: transparent; stroke-width: 0px; }
      }
      @keyframes fadeQuote {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .name {
        font-family: 'Cinzel', serif;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: 12px;
        fill: transparent;
        stroke: #8b949e;
        stroke-width: 1.5px;
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: drawLine 2.5s ease-out forwards, fillText 1.5s ease-in forwards 2.5s;
      }
      
      .quote {
        font-family: 'Cinzel', serif;
        font-size: 16px;
        font-weight: 600;
        fill: #8b949e;
        opacity: 0;
        letter-spacing: 5px;
        text-transform: uppercase;
        animation: fadeQuote 2s ease forwards 3.5s;
      }
      
      .kratos-red {
        fill: #d13030;
      }
    </style>
  </defs>
  
  <text x="50%" y="60%" text-anchor="middle" class="name">PRANAV DUBEY</text>
  <text x="50%" y="90%" text-anchor="middle" class="quote">"Don't be sorry. <tspan class="kratos-red">Be better.</tspan>"</text>
</svg>
