<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Herr+Von+Muellerhoff&amp;display=swap');
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .signature {
        font-family: 'Herr Von Muellerhoff', cursive;
        font-size: 100px;
        fill: none;
        stroke: #e2e8f0;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw 3s ease-in-out forwards;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        fill: #94a3b8;
        opacity: 0;
        animation: fadeIn 1.5s ease-in-out 2.5s forwards;
        letter-spacing: 2px;
      }
    </style>
  </defs>
  
  <text x="50%" y="60%" text-anchor="middle" class="signature">Pranav Dubey</text>
  <text x="50%" y="85%" text-anchor="middle" class="subtitle">Engineering ideas into products.</text>
</svg>
