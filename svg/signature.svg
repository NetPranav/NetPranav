<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&amp;display=swap');
      
      @keyframes floatIn {
        0% { opacity: 0; transform: translateY(20px); filter: blur(4px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0px); }
      }
      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      .name {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 76px;
        font-weight: 800;
        letter-spacing: -2px;
        fill: url(#gradient);
        opacity: 0;
        animation: floatIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .quote {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #8b949e;
        opacity: 0;
        letter-spacing: 2px;
        text-transform: uppercase;
        animation: floatIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
      }
      
      .accent {
        fill: #58a6ff;
      }
    </style>
    
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#8b949e" />
      <stop offset="100%" stop-color="#ffffff" />
      <animate attributeName="x1" values="-100%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  
  <text x="50%" y="65%" text-anchor="middle" class="name">PRANAV DUBEY</text>
  <text x="50%" y="90%" text-anchor="middle" class="quote">"Don't be sorry. <tspan class="accent">Be better.</tspan>"</text>
</svg>
