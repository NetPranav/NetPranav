<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&amp;display=swap');
      
      @keyframes floatIn {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      .hero-text {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -1.5px;
        fill: #f0f6fc;
        opacity: 0;
        animation: floatIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .accent {
        fill: #2ea043; /* GitHub green */
      }
    </style>
  </defs>
  
  <text x="50%" y="65%" text-anchor="middle" class="hero-text">Engineering Systems From <tspan class="accent">First Principles.</tspan></text>
</svg>
