<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="60">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&amp;display=swap');
      
      .text {
        font-family: 'Fira Code', monospace;
        font-size: 16px;
        fill: #8b949e;
      }
      
      .cursor {
        fill: #58a6ff;
        animation: blink 1s step-end infinite;
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      .type-group {
        opacity: 0;
      }
      
      /* Typing animation sequence (26 chars) */
      .c1 { animation: type 12s steps(1) 0.0s infinite; }
      .c2 { animation: type 12s steps(1) 0.1s infinite; }
      .c3 { animation: type 12s steps(1) 0.2s infinite; }
      .c4 { animation: type 12s steps(1) 0.3s infinite; }
      .c5 { animation: type 12s steps(1) 0.4s infinite; }
      .c6 { animation: type 12s steps(1) 0.5s infinite; }
      .c7 { animation: type 12s steps(1) 0.6s infinite; }
      .c8 { animation: type 12s steps(1) 0.7s infinite; }
      .c9 { animation: type 12s steps(1) 0.8s infinite; }
      .c10 { animation: type 12s steps(1) 0.9s infinite; }
      .c11 { animation: type 12s steps(1) 1.0s infinite; }
      .c12 { animation: type 12s steps(1) 1.1s infinite; }
      .c13 { animation: type 12s steps(1) 1.2s infinite; }
      .c14 { animation: type 12s steps(1) 1.3s infinite; }
      .c15 { animation: type 12s steps(1) 1.4s infinite; }
      .c16 { animation: type 12s steps(1) 1.5s infinite; }
      .c17 { animation: type 12s steps(1) 1.6s infinite; }
      .c18 { animation: type 12s steps(1) 1.7s infinite; }
      .c19 { animation: type 12s steps(1) 1.8s infinite; }
      .c20 { animation: type 12s steps(1) 1.9s infinite; }
      .c21 { animation: type 12s steps(1) 2.0s infinite; }
      .c22 { animation: type 12s steps(1) 2.1s infinite; }
      .c23 { animation: type 12s steps(1) 2.2s infinite; }
      .c24 { animation: type 12s steps(1) 2.3s infinite; }
      .c25 { animation: type 12s steps(1) 2.4s infinite; }
      .c26 { animation: type 12s steps(1) 2.5s infinite; }
      
      @keyframes type {
        0% { opacity: 0; }
        0.1% { opacity: 1; }
        90% { opacity: 1; }
        90.1% { opacity: 0; }
        100% { opacity: 0; }
      }
      
      .cursor-move {
        animation: cursorSweep 12s linear infinite;
      }
      
      @keyframes cursorSweep {
        0% { transform: translateX(0px); }
        22% { transform: translateX(250px); } /* 26 chars * 9.6px approx */
        90% { transform: translateX(250px); }
        90.1% { transform: translateX(0px); }
        100% { transform: translateX(0px); }
      }
    </style>
  </defs>
  
  <g transform="translate(275, 35)">
    <text class="text">
      <tspan class="type-group c1">"</tspan><tspan class="type-group c2">D</tspan><tspan class="type-group c3">o</tspan><tspan class="type-group c4">n</tspan><tspan class="type-group c5">'</tspan><tspan class="type-group c6">t</tspan><tspan class="type-group c7"> </tspan><tspan class="type-group c8">b</tspan><tspan class="type-group c9">e</tspan><tspan class="type-group c10"> </tspan><tspan class="type-group c11">s</tspan><tspan class="type-group c12">o</tspan><tspan class="type-group c13">r</tspan><tspan class="type-group c14">r</tspan><tspan class="type-group c15">y</tspan><tspan class="type-group c16">.</tspan><tspan class="type-group c17"> </tspan><tspan class="type-group c18">B</tspan><tspan class="type-group c19">e</tspan><tspan class="type-group c20"> </tspan><tspan class="type-group c21">b</tspan><tspan class="type-group c22">e</tspan><tspan class="type-group c23">t</tspan><tspan class="type-group c24">t</tspan><tspan class="type-group c25">e</tspan><tspan class="type-group c26">r</tspan><tspan class="type-group c26">.</tspan><tspan class="type-group c26">"</tspan>
    </text>
    <rect class="cursor cursor-move" x="0" y="-12" width="10" height="15" />
  </g>
</svg>
