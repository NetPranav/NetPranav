      @keyframes type {
        0% { opacity: 0; }
        0.1% { opacity: 1; }
        90% { opacity: 1; }
        90.1% { opacity: 0; }
        100% { opacity: 0; }
      }
      
      .cursor-move {
        animation: cursorSweep 15s linear infinite;
      }
      
      @keyframes cursorSweep {
        0% { transform: translateX(0px); }
        35% { transform: translateX(614.4px); } /* time to type */
        90% { transform: translateX(614.4px); }
        90.1% { transform: translateX(0px); }
