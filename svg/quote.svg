<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="60">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&amp;display=swap');
      
      .text {
        font-family: 'Fira Code', monospace;
        font-size: 16px;
        fill: #8b949e;
      }
      
      .cursor {
        fill: #58a6ff;
        animation: blink 1s step-end infinite;
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      .type-group {
        opacity: 0;
      }
      
      /* Typing animation sequence */
      .c1 { animation: type 12s steps(1) 0s infinite; }
      .c2 { animation: type 12s steps(1) 0.1s infinite; }
      .c3 { animation: type 12s steps(1) 0.2s infinite; }
      .c4 { animation: type 12s steps(1) 0.3s infinite; }
      .c5 { animation: type 12s steps(1) 0.4s infinite; }
      .c6 { animation: type 12s steps(1) 0.5s infinite; }
      .c7 { animation: type 12s steps(1) 0.6s infinite; }
      .c8 { animation: type 12s steps(1) 0.7s infinite; }
      .c9 { animation: type 12s steps(1) 0.8s infinite; }
      .c10 { animation: type 12s steps(1) 0.9s infinite; }
      .c11 { animation: type 12s steps(1) 1.0s infinite; }
      .c12 { animation: type 12s steps(1) 1.1s infinite; }
      .c13 { animation: type 12s steps(1) 1.2s infinite; }
      .c14 { animation: type 12s steps(1) 1.3s infinite; }
      .c15 { animation: type 12s steps(1) 1.4s infinite; }
      .c16 { animation: type 12s steps(1) 1.5s infinite; }
      .c17 { animation: type 12s steps(1) 1.6s infinite; }
      .c18 { animation: type 12s steps(1) 1.7s infinite; }
      .c19 { animation: type 12s steps(1) 1.8s infinite; }
      .c20 { animation: type 12s steps(1) 1.9s infinite; }
      .c21 { animation: type 12s steps(1) 2.0s infinite; }
      .c22 { animation: type 12s steps(1) 2.1s infinite; }
      .c23 { animation: type 12s steps(1) 2.2s infinite; }
      .c24 { animation: type 12s steps(1) 2.3s infinite; }
      .c25 { animation: type 12s steps(1) 2.4s infinite; }
      .c26 { animation: type 12s steps(1) 2.5s infinite; }
      .c27 { animation: type 12s steps(1) 2.6s infinite; }
      .c28 { animation: type 12s steps(1) 2.7s infinite; }
      .c29 { animation: type 12s steps(1) 2.8s infinite; }
      
      @keyframes type {
        0% { opacity: 0; }
        0.1% { opacity: 1; }
        90% { opacity: 1; }
        90.1% { opacity: 0; }
        100% { opacity: 0; }
      }
      
      .cursor-move {
        animation: cursorSweep 12s linear infinite;
      }
      
      @keyframes cursorSweep {
        0% { transform: translateX(0px); }
        25% { transform: translateX(290px); }
        90% { transform: translateX(290px); }
        90.1% { transform: translateX(0px); }
        100% { transform: translateX(0px); }
      }
    </style>
  </defs>
  
  <g transform="translate(250, 35)">
    <text class="text">
      <tspan class="type-group c1">A</tspan><tspan class="type-group c2">r</tspan><tspan class="type-group c3">c</tspan><tspan class="type-group c4">h</tspan><tspan class="type-group c5">i</tspan><tspan class="type-group c6">t</tspan><tspan class="type-group c7">e</tspan><tspan class="type-group c8">c</tspan><tspan class="type-group c9">t</tspan><tspan class="type-group c10">u</tspan><tspan class="type-group c11">r</tspan><tspan class="type-group c12">e</tspan><tspan class="type-group c13"> </tspan><tspan class="type-group c14">o</tspan><tspan class="type-group c15">v</tspan><tspan class="type-group c16">e</tspan><tspan class="type-group c17">r</tspan><tspan class="type-group c18"> </tspan><tspan class="type-group c19">h</tspan><tspan class="type-group c20">y</tspan><tspan class="type-group c21">p</tspan><tspan class="type-group c22">e</tspan><tspan class="type-group c23">.</tspan>
    </text>
    <rect class="cursor cursor-move" x="0" y="-12" width="10" height="15" />
  </g>
</svg>
