<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 24" width="100%" height="24">
  <defs>
    <linearGradient id="divLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0)" />
      <stop offset="70%" stop-color="rgba(16, 185, 129, 0.2)" />
      <stop offset="100%" stop-color="rgba(100, 255, 218, 0.6)" />
    </linearGradient>
    <linearGradient id="divRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(100, 255, 218, 0.6)" />
      <stop offset="30%" stop-color="rgba(16, 185, 129, 0.2)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0)" />
    </linearGradient>
    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Left Fading Line -->
  <line x1="20" y1="12" x2="400" y2="12" stroke="url(#divLeft)" stroke-width="1" />
  
  <!-- Center Biophilic Accent Node -->
  <g transform="translate(425, 12)">
    <circle cx="0" cy="0" r="3" fill="#00F5A0" filter="url(#node-glow)" />
    <circle cx="-14" cy="0" r="1.5" fill="#10B981" opacity="0.6" />
    <circle cx="14" cy="0" r="1.5" fill="#10B981" opacity="0.6" />
    <line x1="-8" y1="0" x2="-4" y2="0" stroke="#10B981" stroke-width="1" opacity="0.4" />
    <line x1="4" y1="0" x2="8" y2="0" stroke="#10B981" stroke-width="1" opacity="0.4" />
  </g>
  
  <!-- Right Fading Line -->
  <line x1="450" y1="12" x2="830" y2="12" stroke="url(#divRight)" stroke-width="1" />
</svg>
